services:
  - type: web
    name: ishaara-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 180 --bind 0.0.0.0:$PORT local_recognition_server:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: ISHAARA_ALLOWED_ORIGINS
        sync: false
